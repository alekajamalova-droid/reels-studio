<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Студия Reels</title>
<style>
  :root { --bg:#f6f5f2; --card:#fff; --ink:#1b1b1b; --mute:#77736c; --line:#e5e2dc;
          --ok:#1f8a4c; --run:#c27c0e; --err:#c0392b; --acc:#1b1b1b; --acc-ink:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151515; --card:#1f1f1f; --ink:#f0eee9; --mute:#9a958c; --line:#333;
            --ok:#4cc27d; --run:#e3a53a; --err:#ef6b5b; --acc:#f0eee9; --acc-ink:#151515; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 -apple-system, "Inter", "Segoe UI", sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:14px 20px; border-bottom:1px solid var(--line); }
  header h1 { font-size:18px; margin:0 12px 0 0; }
  select, button, textarea, input[type=text] { font:inherit; color:inherit; }
  select { padding:7px 10px; border-radius:8px; border:1px solid var(--line); background:var(--card); max-width:260px; }
  button { padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:var(--card); cursor:pointer; }
  button:disabled { opacity:.45; cursor:default; }
  button.main { background:var(--acc); color:var(--acc-ink); border-color:var(--acc); font-weight:700; }
  label.up { padding:8px 14px; border-radius:8px; border:1px dashed var(--mute); cursor:pointer; }
  main { display:grid; grid-template-columns: minmax(220px,300px) minmax(220px,300px) 1fr; gap:16px; padding:16px 20px; }
  @media (max-width: 900px) { main { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .card h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--mute); margin:0 0 10px; }
  video { width:100%; border-radius:8px; background:#000; aspect-ratio:9/16; object-fit:contain; display:block; }
  .empty { aspect-ratio:9/16; display:grid; place-items:center; color:var(--mute); border:1px dashed var(--line); border-radius:8px; text-align:center; padding:10px; }
  .steps { list-style:none; margin:0; padding:0; }
  .steps li { display:grid; grid-template-columns:14px 1fr; gap:4px 10px; padding:8px 0; border-bottom:1px solid var(--line); }
  .steps li:last-child { border:0; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--line); margin-top:6px; }
  .dot.работает { background:var(--run); animation:p 1s infinite; }
  .dot.готово, .dot.превью { background:var(--ok); }
  .dot.ошибка { background:var(--err); }
  @keyframes p { 50% { opacity:.3; } }
  .steps small { grid-column:2; color:var(--mute); font-size:12.5px; word-break:break-word; }
  textarea { width:100%; min-height:360px; border:1px solid var(--line); border-radius:8px; padding:10px; background:var(--bg);
             font:14px/1.6 ui-monospace, Menlo, monospace; resize:vertical; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; align-items:center; }
  .hint { color:var(--mute); font-size:13px; margin:6px 0 10px; }
  #msg { color:var(--mute); font-size:13px; }
  .right { display:flex; flex-direction:column; gap:16px; }
  a { color:inherit; }
</style>
</head>
<body>
<header>
  <h1>Студия Reels</h1>
  <select id="proj"><option value="">— проект —</option></select>
  <select id="src"><option value="">— исходник —</option></select>
  <button id="start">Начать монтаж</button>
  <label class="up">Загрузить видео<input type="file" id="file" accept="video/*" hidden></label>
  <span id="msg"></span>
</header>
<main>
  <section class="card"><h2>Исходник</h2><div id="srcBox" class="empty">Выбери проект</div></section>
  <section class="card"><h2>Превью / готовый рилс</h2><div id="prevBox" class="empty">Превью появится после рендера</div>
    <div class="row" id="dl"></div></section>
  <div class="right">
    <section class="card"><h2>Агенты</h2><ul class="steps" id="steps"></ul></section>
    <section class="card"><h2>Расшифровка</h2>
      <p class="hint">Исправь ошибки в тексте после «]». Время не трогай. Удалишь строку — фраза вырежется из ролика. Строка «ХУК:» — крупный текст первых 3 секунд.</p>
      <textarea id="tr" spellcheck="false" placeholder="Расшифровка появится здесь"></textarea>
      <div class="row">
        <button id="save">Сохранить</button>
        <button id="prev">Превью</button>
        <button id="done" class="main">Готово</button>
      </div>
    </section>
  </div>
</main>
<script>
const STEPS = ["Расшифровка","Сценарист","Субтитры","Звук","Рендер"];
const $ = id => document.getElementById(id);
let cur = "", dirty = false, lastPrev = -1, lastFinal = "", trLoaded = false;
try { cur = localStorage.getItem("reels-proj") || ""; } catch(e) {}

async function api(url, body) {
  const r = await fetch(url, body === undefined ? {} : {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
function msg(t) { $("msg").textContent = t; }

async function loadList() {
  const d = await api("/api/list");
  $("src").innerHTML = '<option value="">— исходник —</option>' + d.sources.map(s => `<option>${esc(s)}</option>`).join("");
  $("proj").innerHTML = '<option value="">— проект —</option>' + d.projects.map(p => `<option value="${esc(p.name)}">${esc(p.name)}</option>`).join("");
  if (cur && d.projects.some(p => p.name === cur)) $("proj").value = cur; else if (cur) cur = "";
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function selectProj(name) {
  cur = name; dirty = false; trLoaded = false; lastPrev = -1; lastFinal = "";
  try { localStorage.setItem("reels-proj", name); } catch(e) {}
  $("tr").value = "";
  $("srcBox").outerHTML = name ? `<video id="srcBox" controls preload="metadata" src="/media/${encodeURIComponent(name)}/source"></video>` : `<div id="srcBox" class="empty">Выбери проект</div>`;
  $("prevBox").outerHTML = `<div id="prevBox" class="empty">Превью появится после рендера</div>`;
  $("dl").innerHTML = "";
  tick();
}

async function tick() {
  if (!cur) { $("steps").innerHTML = STEPS.map(s => `<li><span class="dot"></span><b>${s}</b><small>ждёт</small></li>`).join(""); return; }
  let st; try { st = await api(`/api/state/${encodeURIComponent(cur)}`); } catch(e) { return; }
  $("steps").innerHTML = STEPS.map(s => { const x = st.steps[s] || {status:"ждёт", msg:""};
    const cls = x.status.split(" ")[0];
    return `<li><span class="dot ${cls}"></span><b>${s}</b><small>${esc(x.status)}${x.msg ? " — " + esc(x.msg) : ""}</small></li>`; }).join("");
  if (st.has_transcript && !trLoaded && !dirty) { $("tr").value = (await api(`/api/transcript/${encodeURIComponent(cur)}`)).text; trLoaded = true; }
  const busy = !!st.busy;
  ["prev","done","save"].forEach(id => $(id).disabled = busy || !st.has_transcript);
  msg(busy ? `Работает: ${st.busy}…` : "");
  const base = `/media/${encodeURIComponent(cur)}`;
  if (st.has_final && st.final_name + st.preview_t !== lastFinal && st.steps["Рендер"].status === "готово") {
    lastFinal = st.final_name + st.preview_t;
    $("prevBox").outerHTML = `<video id="prevBox" controls preload="metadata" src="${base}/final?t=${Date.now()}"></video>`;
    $("dl").innerHTML = `<a href="${base}/final?dl=1">Скачать ${esc(st.final_name)}</a>`;
  } else if (st.has_preview && st.preview_t !== lastPrev && st.steps["Рендер"].status !== "готово") {
    lastPrev = st.preview_t;
    $("prevBox").outerHTML = `<video id="prevBox" controls preload="metadata" src="${base}/preview?t=${st.preview_t}"></video>`;
    $("dl").innerHTML = "<span class='hint'>Превью 540x960</span>";
  }
}

async function save() { if (!cur) return; await api(`/api/transcript/${encodeURIComponent(cur)}`, {text:$("tr").value}); dirty = false; msg("Сохранено"); }
$("tr").addEventListener("input", () => dirty = true);
$("save").onclick = save;
$("prev").onclick = async () => { await save(); await api(`/api/preview/${encodeURIComponent(cur)}`, {}); tick(); };
$("done").onclick = async () => { await save(); lastFinal = ""; await api(`/api/render/${encodeURIComponent(cur)}`, {}); tick(); };
$("proj").onchange = e => selectProj(e.target.value);
$("start").onclick = async () => {
  const s = $("src").value; if (!s) { msg("Выбери исходник"); return; }
  const r = await api("/api/start", {source:s}); await loadList(); $("proj").value = r.name; selectProj(r.name);
};
$("file").onchange = async e => {
  const f = e.target.files[0]; if (!f) return; msg("Загружаю…");
  const fd = new FormData(); fd.append("file", f);
  const r = await (await fetch("/api/upload", {method:"POST", body:fd})).json();
  await loadList(); $("src").value = r.name; msg("Загружено — нажми «Начать монтаж»");
};
loadList().then(() => selectProj(cur));
setInterval(tick, 1500);
</script>
</body>
</html>
